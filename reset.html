<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanal Laboratuvar - Temizleme</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131f;color:#eef7ff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div>
    <h2>Eski sürüm temizleniyor</h2>
    <p>Birazdan ana sayfa açılacak.</p>
  </div>
  <script>
    (async()=>{
      try{
        const regs=await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(regs.map(r=>r.unregister()));
      }catch(e){}
      try{
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }catch(e){}
      location.replace("./?clean=21&t="+Date.now());
    })();
  </script>
</body>
</html>
