<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanal Laboratuvar - Temizleme</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131f;color:#eef7ff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
    .box{max-width:560px}
    .dot{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.18);
      border-top-color:#55dcc5;margin:0 auto 18px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h2>Eski sürümler temizleniyor</h2>
    <p>Önbellek ve eski Service Worker kayıtları siliniyor.</p>
  </div>
  <script>
    (async()=>{
      try{
        const regs=await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(regs.map(r=>r.unregister()));
      }catch(e){}
      try{
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }catch(e){}
      try{
        localStorage.removeItem("eem-sw-reset-v19");
        localStorage.removeItem("eem-sw-reset-v18");
      }catch(e){}
      location.replace("./?clean=20&t="+Date.now());
    })();
  </script>
</body>
</html>
